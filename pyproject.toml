[project]
name = "voice-demo-generator"
version = "0.1.0"
description = "Turn a YAML script into a narrated product demo video: TTS (ElevenLabs incl. cloned voices, or local), Whisper-aligned captions and a script check, and an ffmpeg pipeline for 16:9 and 9:16."
readme = "README.md"
license = "MIT"
authors = [{ name = "João Pedro Franco" }]
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0",
    "httpx>=0.27",
    "pillow>=10.4",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.scripts]
demo-gen = "demo_gen.cli:main"

[dependency-groups]
dev = ["mypy>=1.11", "pre-commit>=3.8", "pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6", "types-PyYAML>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/demo_gen"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "S"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=demo_gen --cov-report=term-missing"

[tool.coverage.report]
fail_under = 85
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
